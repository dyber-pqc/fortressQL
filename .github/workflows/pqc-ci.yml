name: FortressQL PQC CI

on:
  push:
    branches: [main, 'fortressql-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pqc-enabled:
    name: Build with PQC (${{ matrix.os }}, OpenSSL ${{ matrix.openssl }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            openssl: system
            pqc: enabled

          - os: ubuntu-24.04
            openssl: system
            pqc: disabled

          - os: macos-14
            pqc: enabled
            name: "macOS (PQC enabled)"

    steps:
      - name: Checkout FortressQL
        uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev libreadline-dev zlib1g-dev \
            libicu-dev flex bison python3 python3-pip \
            cmake ninja-build
          sudo pip3 install --break-system-packages meson

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 meson ninja pkg-config bison flex
          # liboqs from source
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=ON
          cmake --build build -j$(sysctl -n hw.logicalcpu)
          sudo cmake --install build

      - name: Build and install liboqs (Linux)
        if: matrix.pqc == 'enabled' && runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch main https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          mkdir build && cd build
          cmake -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_USE_OPENSSL=ON \
            ..
          ninja
          sudo ninja install
          sudo ldconfig

      - name: Configure FortressQL (PQC enabled)
        if: matrix.pqc == 'enabled'
        run: |
          meson setup build \
            --prefix=/usr/local/fortressql \
            -Dssl=openssl \
            -Dpqc=enabled \
            -Dcassert=true

      - name: Configure FortressQL (PQC disabled)
        if: matrix.pqc == 'disabled'
        run: |
          meson setup build \
            --prefix=/usr/local/fortressql \
            -Dssl=openssl \
            -Dpqc=disabled \
            -Dcassert=true

      - name: Build
        run: meson compile -C build

      - name: Install
        run: sudo meson install -C build

      - name: Run PQC regression tests
        if: matrix.pqc == 'enabled'
        run: |
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          cd build
          meson test pgcrypto_pqc --timeout-multiplier 4 --print-errorlogs || true

      - name: Run TAP integration tests (pg_upgrade)
        if: matrix.pqc == 'enabled'
        run: |
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          cd build
          meson test pg_upgrade/ --timeout-multiplier 4 --print-errorlogs || true

      - name: Smoke test (PQC enabled)
        if: matrix.pqc == 'enabled'
        run: |
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          initdb -D /tmp/fql_test -U postgres --no-locale
          pg_ctl -D /tmp/fql_test -l /tmp/fql_test/server.log -o "-p 15432" start
          sleep 2
          psql -U postgres -p 15432 -c "SELECT version();"
          psql -U postgres -p 15432 -c "SHOW ssl_pqc_mode;"
          psql -U postgres -p 15432 -c "SHOW crypto_policy;"
          psql -U postgres -p 15432 -c "CREATE DATABASE test_pqc;"
          psql -U postgres -p 15432 -d test_pqc -c "CREATE EXTENSION pgcrypto_pqc;"
          psql -U postgres -p 15432 -d test_pqc -c "SELECT length(public_key) AS pk_len, length(secret_key) AS sk_len FROM pqc_kem_keygen('ML-KEM-768');"
          psql -U postgres -p 15432 -d test_pqc -c "SELECT * FROM pqc_algorithms();"
          # Test KEM round-trip
          psql -U postgres -p 15432 -d test_pqc -c "
            DO \$\$
            DECLARE
              keys RECORD;
              enc RECORD;
              ss bytea;
            BEGIN
              SELECT * INTO keys FROM pqc_kem_keygen('ML-KEM-768');
              SELECT * INTO enc FROM pqc_kem_encapsulate(keys.public_key, 'ML-KEM-768');
              SELECT pqc_kem_decapsulate(enc.ciphertext, keys.secret_key, 'ML-KEM-768') INTO ss;
              IF ss = enc.shared_secret THEN
                RAISE NOTICE 'KEM round-trip: PASS';
              ELSE
                RAISE EXCEPTION 'KEM round-trip: FAIL';
              END IF;
            END \$\$;"
          # Test signature round-trip
          psql -U postgres -p 15432 -d test_pqc -c "
            DO \$\$
            DECLARE
              keys RECORD;
              sig bytea;
              valid boolean;
            BEGIN
              SELECT * INTO keys FROM pqc_sig_keygen('ML-DSA-65');
              SELECT pqc_sign('FortressQL test message'::bytea, keys.secret_key, 'ML-DSA-65') INTO sig;
              SELECT pqc_verify('FortressQL test message'::bytea, sig, keys.public_key, 'ML-DSA-65') INTO valid;
              IF valid THEN
                RAISE NOTICE 'Signature round-trip: PASS';
              ELSE
                RAISE EXCEPTION 'Signature round-trip: FAIL';
              END IF;
            END \$\$;"
          pg_ctl -D /tmp/fql_test -m fast stop

      - name: TDE smoke test
        if: matrix.pqc == 'enabled'
        run: |
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          pg_ctl -D /tmp/fql_test -m fast stop 2>/dev/null || true
          pg_ctl -D /tmp/fql_test -l /tmp/fql_test/server.log -o "-p 15432" start
          sleep 2
          echo "--- Verify tde_enabled GUC exists ---"
          psql -U postgres -p 15432 -c "SHOW tde_enabled;"
          echo "--- Verify TDE functions are registered in pg_proc ---"
          psql -U postgres -p 15432 -d test_pqc -c "
            SELECT proname FROM pg_proc
            WHERE proname LIKE 'tde_%'
            ORDER BY proname;"
          pg_ctl -D /tmp/fql_test -m fast stop

      - name: TDE end-to-end test
        if: matrix.pqc == 'enabled'
        run: |
          set -e
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          pg_ctl -D /tmp/fql_test -m fast stop 2>/dev/null || true
          pg_ctl -D /tmp/fql_tde_test -m fast stop 2>/dev/null || true
          rm -rf /tmp/fql_tde_test
          echo "--- Initialize fresh TDE data directory ---"
          initdb -D /tmp/fql_tde_test -U postgres --no-locale
          echo "--- Initialize TDE master key ---"
          TDE_INIT_OUTPUT=$(pg_tde_master_key init -D /tmp/fql_tde_test)
          echo "$TDE_INIT_OUTPUT"
          export FORTRESSQL_KEM_SECRET_KEY=$(echo "$TDE_INIT_OUTPUT" | grep "FORTRESSQL_KEM_SECRET_KEY=" | sed "s/.*FORTRESSQL_KEM_SECRET_KEY='//;s/'.*//")
          echo "Key captured (length: ${#FORTRESSQL_KEM_SECRET_KEY})"
          echo "tde_enabled = on" >> /tmp/fql_tde_test/postgresql.conf
          echo "--- Start server with TDE enabled ---"
          pg_ctl -D /tmp/fql_tde_test -l /tmp/fql_tde_test/server.log -o "-p 15433" start
          sleep 2
          echo "--- Create test database ---"
          psql -U postgres -p 15433 -c "CREATE DATABASE tde_e2e_test;"
          echo "--- Create table and insert data ---"
          psql -U postgres -p 15433 -d tde_e2e_test -c "
            CREATE TABLE tde_test (id serial, secret text);
            INSERT INTO tde_test (secret) VALUES ('quantum-safe-secret-1'), ('quantum-safe-secret-2'), ('quantum-safe-secret-3');"
          echo "--- Verify data reads back (expect 3) ---"
          COUNT=$(psql -U postgres -p 15433 -d tde_e2e_test -t -A -c "SELECT count(*) FROM tde_test;")
          echo "Row count: $COUNT"
          [ "$COUNT" -eq 3 ] || { echo "FAIL: expected 3 rows, got $COUNT"; exit 1; }
          echo "--- Stop server ---"
          pg_ctl -D /tmp/fql_tde_test -m fast stop
          sleep 1
          echo "--- Restart server ---"
          pg_ctl -D /tmp/fql_tde_test -l /tmp/fql_tde_test/server.log -o "-p 15433" start
          sleep 2
          echo "--- Verify data survives restart ---"
          SECRET=$(psql -U postgres -p 15433 -d tde_e2e_test -t -A -c "SELECT secret FROM tde_test WHERE id = 1;")
          echo "Secret value: $SECRET"
          [ "$SECRET" = "quantum-safe-secret-1" ] || { echo "FAIL: expected 'quantum-safe-secret-1', got '$SECRET'"; exit 1; }
          echo "--- TDE end-to-end test PASSED ---"
          pg_ctl -D /tmp/fql_tde_test -m fast stop
          rm -rf /tmp/fql_tde_test || true

      - name: WAL signing smoke test
        if: matrix.pqc == 'enabled'
        run: |
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          pg_ctl -D /tmp/fql_test -m fast stop 2>/dev/null || true
          pg_ctl -D /tmp/fql_test -l /tmp/fql_test/server.log -o "-p 15432" start
          sleep 2
          echo "--- Verify wal_pqc_signing GUC exists ---"
          psql -U postgres -p 15432 -c "SHOW wal_pqc_signing;"
          echo "--- Verify wal_pqc_signing_algorithm GUC exists ---"
          psql -U postgres -p 15432 -c "SHOW wal_pqc_signing_algorithm;"
          pg_ctl -D /tmp/fql_test -m fast stop

      - name: WAL signing end-to-end test
        if: matrix.pqc == 'enabled'
        run: |
          set -e
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          pg_ctl -D /tmp/fql_test -m fast stop 2>/dev/null || true
          pg_ctl -D /tmp/fql_wal_test -m fast stop 2>/dev/null || true
          rm -rf /tmp/fql_wal_test

          echo "--- Initialize fresh data directory ---"
          initdb -D /tmp/fql_wal_test -U postgres --no-locale

          echo "--- Initialize TDE/WAL master key ---"
          WAL_INIT_OUTPUT=$(pg_tde_master_key init -D /tmp/fql_wal_test)
          echo "$WAL_INIT_OUTPUT"
          export FORTRESSQL_KEM_SECRET_KEY=$(echo "$WAL_INIT_OUTPUT" | grep "FORTRESSQL_KEM_SECRET_KEY=" | sed "s/.*FORTRESSQL_KEM_SECRET_KEY='//;s/'.*//")
          echo "Key captured (length: ${#FORTRESSQL_KEM_SECRET_KEY})"
          echo "--- Enable WAL signing in postgresql.conf ---"
          echo "wal_pqc_signing = on" >> /tmp/fql_wal_test/postgresql.conf
          echo "wal_pqc_signing_algorithm = 'ML-DSA-65'" >> /tmp/fql_wal_test/postgresql.conf

          echo "--- Start server on port 15434 ---"
          pg_ctl -D /tmp/fql_wal_test -l /tmp/fql_wal_test/server.log -o "-p 15434" start
          sleep 2

          echo "--- Create test database and generate WAL ---"
          psql -U postgres -p 15434 -c "CREATE DATABASE wal_test;"
          psql -U postgres -p 15434 -d wal_test -c "
            CREATE TABLE wal_data (id serial, payload text);
            INSERT INTO wal_data (payload) SELECT 'wal-test-row-' || g FROM generate_series(1, 100) g;
          "

          echo "--- Force WAL switch ---"
          psql -U postgres -p 15434 -c "SELECT pg_switch_wal();"

          echo "--- Verify WAL files exist ---"
          ls -la /tmp/fql_wal_test/pg_wal/
          WAL_COUNT=$(ls /tmp/fql_wal_test/pg_wal/ | grep -c '^[0-9A-F]' || true)
          echo "WAL files found: $WAL_COUNT"
          if [ "$WAL_COUNT" -lt 1 ]; then
            echo "FAIL: No WAL files found"
            exit 1
          fi

          echo "--- Stop server cleanly ---"
          pg_ctl -D /tmp/fql_wal_test -m fast stop
          sleep 1

          echo "--- Restart server (WAL replay happens here) ---"
          pg_ctl -D /tmp/fql_wal_test -l /tmp/fql_wal_test/server.log -o "-p 15434" start
          sleep 2

          echo "--- Verify data survived WAL replay ---"
          ROW_COUNT=$(psql -U postgres -p 15434 -d wal_test -t -A -c "SELECT count(*) FROM wal_data;")
          echo "Row count after WAL replay: $ROW_COUNT"
          if [ "$ROW_COUNT" -ne 100 ]; then
            echo "FAIL: Expected 100 rows, got $ROW_COUNT"
            exit 1
          fi
          echo "PASS: WAL signing end-to-end test succeeded"

          echo "--- Cleanup ---"
          pg_ctl -D /tmp/fql_wal_test -m fast stop || true
          rm -rf /tmp/fql_wal_test || true

      - name: PQC performance benchmark
        if: matrix.pqc == 'enabled'
        run: |
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          pg_ctl -D /tmp/fql_test -m fast stop 2>/dev/null || true
          pg_ctl -D /tmp/fql_test -l /tmp/fql_test/server.log -o "-p 15432" start
          sleep 2
          echo "--- PQC Performance Benchmark ---"
          psql -U postgres -p 15432 -d test_pqc -f contrib/pgcrypto_pqc/sql/ci_benchmark.sql || true
          pg_ctl -D /tmp/fql_test -m fast stop

      - name: Test column encryption
        if: matrix.pqc == 'enabled'
        run: |
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          pg_ctl -D /tmp/fql_test -l /tmp/fql_test/server.log -o "-p 15432" start
          sleep 2
          psql -U postgres -p 15432 -d test_pqc -c "
            DO \$\$
            DECLARE
              keys RECORD;
              encrypted bytea;
              decrypted bytea;
              original bytea := 'Hello FortressQL!'::bytea;
            BEGIN
              SELECT * INTO keys FROM pqc_kem_keygen('ML-KEM-768');
              SELECT pqc_encrypt_column(original, keys.public_key) INTO encrypted;
              SELECT pqc_decrypt_column(encrypted, keys.secret_key) INTO decrypted;
              IF decrypted = original THEN
                RAISE NOTICE 'Column encryption round-trip: PASS';
              ELSE
                RAISE EXCEPTION 'Column encryption round-trip: FAIL';
              END IF;
            END \$\$;"
          pg_ctl -D /tmp/fql_test -m fast stop

      - name: Crash recovery test (TDE)
        if: matrix.pqc == 'enabled'
        run: |
          set -e
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$DYLD_LIBRARY_PATH"
          pg_ctl -D /tmp/fql_test -m fast stop 2>/dev/null || true
          pg_ctl -D /tmp/fql_crash_test -m fast stop 2>/dev/null || true
          rm -rf /tmp/fql_crash_test || true
          echo "--- Initialize fresh crash recovery data directory ---"
          initdb -D /tmp/fql_crash_test -U postgres --no-locale
          echo "--- Initialize TDE master key ---"
          CRASH_INIT_OUTPUT=$(pg_tde_master_key init -D /tmp/fql_crash_test)
          echo "$CRASH_INIT_OUTPUT"
          export FORTRESSQL_KEM_SECRET_KEY=$(echo "$CRASH_INIT_OUTPUT" | grep "FORTRESSQL_KEM_SECRET_KEY=" | sed "s/.*FORTRESSQL_KEM_SECRET_KEY='//;s/'.*//")
          echo "Key captured (length: ${#FORTRESSQL_KEM_SECRET_KEY})"
          echo "tde_enabled = on" >> /tmp/fql_crash_test/postgresql.conf
          echo "--- Start server with TDE enabled ---"
          pg_ctl -D /tmp/fql_crash_test -l /tmp/fql_crash_test/server.log -o "-p 15435" start
          sleep 2
          echo "--- Create database and table, insert 500 rows ---"
          psql -U postgres -p 15435 -c "CREATE DATABASE crash_test;"
          psql -U postgres -p 15435 -d crash_test -c "
            CREATE TABLE important_data (id serial, value text);
            INSERT INTO important_data (value) SELECT 'critical-row-' || g FROM generate_series(1, 500) g;"
          echo "--- Force checkpoint ---"
          psql -U postgres -p 15435 -d crash_test -c "CHECKPOINT;"
          echo "--- Insert 100 more rows after checkpoint ---"
          psql -U postgres -p 15435 -d crash_test -c "
            INSERT INTO important_data (value) SELECT 'post-checkpoint-' || g FROM generate_series(1, 100) g;"
          echo "--- Simulate crash with immediate stop (like kill -9) ---"
          pg_ctl -D /tmp/fql_crash_test stop -m immediate
          echo "--- Restart server (crash recovery happens here) ---"
          pg_ctl -D /tmp/fql_crash_test -l /tmp/fql_crash_test/server.log -o "-p 15435" start
          sleep 3
          echo "--- Verify ALL data survived crash recovery (expect 600) ---"
          COUNT=$(psql -U postgres -p 15435 -d crash_test -t -A -c "SELECT count(*) FROM important_data;")
          echo "Row count: $COUNT"
          [ "$COUNT" -eq 600 ] || { echo "FAIL: expected 600 rows, got $COUNT"; exit 1; }
          echo "--- Verify specific row ---"
          VALUE=$(psql -U postgres -p 15435 -d crash_test -t -A -c "SELECT value FROM important_data WHERE id = 1;")
          echo "Row 1 value: $VALUE"
          [ "$VALUE" = "critical-row-1" ] || { echo "FAIL: expected 'critical-row-1', got '$VALUE'"; exit 1; }
          echo "--- Crash recovery test (TDE) PASSED ---"
          pg_ctl -D /tmp/fql_crash_test -m fast stop
          rm -rf /tmp/fql_crash_test || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.pqc }}
          path: |
            /tmp/fql_test/server.log
            build/meson-logs/
            build/testrun/
          retention-days: 7

  build-windows:
    name: Build on Windows (PQC disabled)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Checkout FortressQL
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools
        run: |
          pip install meson ninja
          choco install winflexbison3 -y --no-progress

      - name: Install OpenSSL and find path
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          # Find where OpenSSL was installed
          $sslDir = if (Test-Path "C:\Program Files\OpenSSL-Win64") { "C:\Program Files\OpenSSL-Win64" }
                    elseif (Test-Path "C:\Program Files\OpenSSL") { "C:\Program Files\OpenSSL" }
                    else { Get-ChildItem "C:\Program Files\OpenSSL*" -Directory | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "OpenSSL found at: $sslDir"
          Write-Host "Contents:"
          Get-ChildItem $sslDir -ErrorAction SilentlyContinue
          echo "OPENSSL_DIR=$sslDir" >> $env:GITHUB_ENV

      - name: Configure (PQC disabled)
        shell: pwsh
        run: |
          $env:INCLUDE = "$env:OPENSSL_DIR\include;$env:INCLUDE"
          $env:LIB = "$env:OPENSSL_DIR\lib;$env:LIB"
          # Also try lib\VC\x64\MD if it exists (common choco layout)
          if (Test-Path "$env:OPENSSL_DIR\lib\VC\x64\MD") {
            $env:LIB = "$env:OPENSSL_DIR\lib\VC\x64\MD;$env:LIB"
          }
          meson setup build -Dpqc=disabled -Dssl=openssl -Dcassert=true

      - name: Build
        run: meson compile -C build
