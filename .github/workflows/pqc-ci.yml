name: FortressQL PQC CI

on:
  push:
    branches: [main, 'fortressql-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pqc-enabled:
    name: Build with PQC (${{ matrix.os }}, OpenSSL ${{ matrix.openssl }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            openssl: system
            pqc: enabled

          - os: ubuntu-24.04
            openssl: system
            pqc: disabled

    steps:
      - name: Checkout FortressQL
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev libreadline-dev zlib1g-dev \
            libicu-dev flex bison python3 python3-pip \
            cmake ninja-build
          sudo pip3 install --break-system-packages meson

      - name: Build and install liboqs
        if: matrix.pqc == 'enabled'
        run: |
          git clone --depth 1 --branch main https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          mkdir build && cd build
          cmake -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_USE_OPENSSL=ON \
            ..
          ninja
          sudo ninja install
          sudo ldconfig

      - name: Configure FortressQL (PQC enabled)
        if: matrix.pqc == 'enabled'
        run: |
          meson setup build \
            --prefix=/usr/local/fortressql \
            -Dssl=openssl \
            -Dpqc=enabled \
            -Dcassert=true

      - name: Configure FortressQL (PQC disabled)
        if: matrix.pqc == 'disabled'
        run: |
          meson setup build \
            --prefix=/usr/local/fortressql \
            -Dssl=openssl \
            -Dpqc=disabled \
            -Dcassert=true

      - name: Build
        run: meson compile -C build

      - name: Install
        run: sudo meson install -C build

      - name: Smoke test (PQC enabled)
        if: matrix.pqc == 'enabled'
        run: |
          export PATH="/usr/local/fortressql/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/fortressql/lib:/usr/local/lib:$LD_LIBRARY_PATH"
          initdb -D /tmp/fql_test -U postgres --no-locale
          pg_ctl -D /tmp/fql_test -l /tmp/fql_test/server.log -o "-p 15432" start
          sleep 2
          psql -U postgres -p 15432 -c "SELECT version();"
          psql -U postgres -p 15432 -c "SHOW ssl_pqc_mode;"
          psql -U postgres -p 15432 -c "SHOW crypto_policy;"
          psql -U postgres -p 15432 -c "CREATE DATABASE test_pqc;"
          psql -U postgres -p 15432 -d test_pqc -c "CREATE EXTENSION pgcrypto_pqc;"
          psql -U postgres -p 15432 -d test_pqc -c "SELECT length(public_key) AS pk_len, length(secret_key) AS sk_len FROM pqc_kem_keygen('ML-KEM-768');"
          pg_ctl -D /tmp/fql_test -m fast stop

  build-windows:
    name: Build on Windows (PQC disabled)
    runs-on: windows-2022
    steps:
      - name: Checkout FortressQL
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools
        run: pip install meson ninja

      - name: Install OpenSSL
        shell: bash
        run: |
          choco install openssl -y --no-progress
          echo "OPENSSL_ROOT=C:/Program Files/OpenSSL-Win64" >> $GITHUB_ENV

      - name: Configure (PQC disabled)
        shell: bash
        run: |
          export INCLUDE="C:/Program Files/OpenSSL-Win64/include;$INCLUDE"
          export LIB="C:/Program Files/OpenSSL-Win64/lib;$LIB"
          meson setup build \
            -Dpqc=disabled \
            -Dssl=openssl \
            -Dcassert=true \
            -Dextra_include_dirs="C:/Program Files/OpenSSL-Win64/include" \
            -Dextra_lib_dirs="C:/Program Files/OpenSSL-Win64/lib"

      - name: Build
        run: meson compile -C build
