name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          git archive --format=tar.gz --prefix=fortressql-${VERSION}/ \
            -o fortressql-${VERSION}.tar.gz HEAD

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fortressql-*.tar.gz
