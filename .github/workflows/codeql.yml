name: "CodeQL Security Analysis"

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/crypto/**'
      - 'contrib/pgcrypto_pqc/**'
      - 'src/bin/pg_tde_master_key/**'
      - 'src/bin/pg_dump/compress_pqc.*'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

jobs:
  analyze:
    name: Analyze PQC Code
    runs-on: ubuntu-24.04
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libreadline-dev zlib1g-dev \
            pkg-config meson ninja-build flex bison
          # Install liboqs
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=ON
          cmake --build build -j$(nproc)
          sudo cmake --install build
          sudo ldconfig

      - name: Configure and build
        run: |
          meson setup build -Dpqc=enabled -Dssl=openssl -Dcassert=true
          meson compile -C build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
